# A single-broker Kafka for the replay (G-05, execution plan v3.1 W7 D3).
#
#   docker compose -f docker-compose.kafka.yml up -d
#   bash scripts/kafka_live.sh
#   docker compose -f docker-compose.kafka.yml down -v
#
# KRaft mode, so there is no ZooKeeper to run: one container, no volumes to clean up
# beyond `down -v`. The broker advertises `localhost:9092`, which is exactly what
# `config.KAFKA_BOOTSTRAP_SERVERS` already defaults to, so nothing in the code changes
# between the file-source path and this one -- that is the point of the exercise
# (D-035 says the Kafka path had never run against a live broker).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: control-tower-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The replay writes both topics; auto-creation keeps the run to one command.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
