[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -m pytest` puts the working directory on sys.path and a bare `pytest`
# does not, so `import src...` worked on developer machines and failed in CI
# with "No module named 'src'". Setting it here makes both invocations behave
# the same rather than relying on how the suite happens to be started.
pythonpath = ["."]
# Markers exist so CI can run the fast suite on every pull request and the
# JVM-dependent suite on a runner that has actually installed a JDK. Without the
# split, either every PR waits for Spark to start or nothing runs at all.
markers = [
    "spark: needs a JVM and a SparkSession (JDK 17 on JAVA_HOME)",
    "kafka: needs a reachable Kafka broker",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]

[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = ["web", "notebooks", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default
    # argument, which B008 flags on every route. The framework requires it.
    "B008",
    # Long lines inside docstrings and comments carry the reasoning this project
    # keeps in prose; the formatter handles code width.
    "E501",
    # `class RouteType(str, Enum)` -> `StrEnum`.
    #
    # Declined deliberately. It changes what `f"{RouteType.FTL}"` produces --
    # "RouteType.FTL" today, "FTL" after -- on the enums `src/tms/models.py`
    # serialises to the API and stores in SQLite. Nothing in the tree
    # interpolates one today, so the migration would be safe *now*; the
    # objection is that it is a behaviour change to a serialisation boundary
    # bought for a style point, and the next person to write an f-string around
    # a status would get a different payload depending on when they did it.
    # Revisit if these enums ever need `StrEnum`'s semantics for their own sake.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
# Deliberately not pinned to 3.11.
#
# Pinning it made mypy parse the *installed* numpy stubs as 3.11 source, and
# current numpy ships `type` statements, which are 3.12 syntax. The result was
# a syntax error inside a dependency that stopped the check before it reached
# any project code -- a type checker reporting on numpy's grammar rather than
# on this repository. Unset, mypy uses the interpreter it runs on, which is the
# one whose libraries it is reading.
#
# The 3.11 floor is enforced where it can actually be tested: the CI matrix runs
# the suite on 3.11 and 3.13.
warn_unused_configs = true
ignore_missing_imports = true
# Strict only where the work order asks for it. Widening this to the whole tree
# on day one produces hundreds of findings nobody reads.
files = ["src/common", "src/agents"]

[[tool.mypy.overrides]]
module = ["src.agents.doc_corpus.*"]
ignore_errors = true
