name: tests

# There are 27 test files and roughly 4,500 lines of tests, and until now the
# only workflow ran the web export. A broken commit to src/agents/ or src/tms/
# reached dev with no signal at all.
#
# Split in two because the two halves cost very different amounts:
#   fast  — every push and PR, no JVM, finishes in a couple of minutes
#   spark — pushes to dev and a nightly run, installs a JDK and a broker
#
# A PR therefore gets an answer quickly, and the JVM-dependent paths still get
# exercised somewhere other than one laptop.

on:
  push:
    branches: [main, dev, "wo-**"]
  pull_request:
    branches: [main, dev]
  schedule:
    # 02:30 UTC ≈ 08:00 IST — the overnight run is read in the morning.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint
        run: ruff check src tests
      # No `ruff format --check` gate.
      #
      # It would reformat 96 of 133 files. That is not a lint finding, it is a
      # rewrite of the whole tree in one commit, landing on top of a line-ending
      # renormalisation and immediately before a review -- and this code has
      # alignment that is deliberate, like the column layout in the PDF
      # templates and the decision tables in the docstrings.
      #
      # The linter catches what is wrong. The formatter changes what is merely
      # different, and adopting it is its own decision with its own commit.
      - name: Types
        # src/common, src/agents, src/ml and src/api, per pyproject, with the few
        # exclusions it documents (E3).
        run: mypy

      # The numbers in the paper and the README are generated from one frozen results
      # file. These fail the push if a result file moved without a new freeze, if
      # paper/numbers.tex is stale, or if the printed bibliography is out of date --
      # the same checks the nightly run repeats (pure Python; no data, no JVM).
      - name: Frozen results still verify
        run: python -m src.ml.results_freeze --verify
      - name: Paper numbers are current
        run: |
          python -m src.report.paper_numbers --check
          python -m src.report.bib_print --check

  fast:
    name: pytest (no spark) · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floors in requirements.txt exist because the obvious "stable"
        # pins have no cp313 wheels and pip silently builds from source. Both
        # ends of the supported range are tested so that stays true.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run the suite
        env:
          # The agents must not reach a provider from CI. Every one of them
          # runs with --no-llm, and an absent key is how that is enforced.
          LLM_PROVIDER: none
          TMS_API_KEY: ci-test-key
        run: pytest -m "not spark" -q

  locked:
    name: pytest from requirements.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The point of this job, and why it is separate from `fast`.
      #
      # requirements.txt specifies floors, so a fresh resolve six months from
      # now installs different versions than the ones that produced the frozen
      # results -- and nothing announces the difference. That is not
      # hypothetical: it is what P-65 was. The lock pins the set that is known
      # to work, and this job is the evidence that it still installs and still
      # passes.
      #
      # `fast` keeps installing from the floors on both 3.11 and 3.13, so the
      # declared range is still tested. The two jobs answer different
      # questions: "does the stated range still resolve" and "does the exact
      # recorded set still work".
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run the suite
        env:
          LLM_PROVIDER: none
          TMS_API_KEY: ci-test-key
        run: pytest -m "not spark" -q

  spark:
    name: pytest (spark + kafka)
    # Only where it is worth the minutes: dev, the nightly run, or by hand.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    services:
      # Closes the last trace of the "no Docker on the dev machine" constraint
      # that kept the Kafka path off a broker for two weeks (D-035, D-055).
      #
      # The official Apache image, not bitnami/kafka: Bitnami withdrew its tags from
      # Docker Hub, and from 27 Sep this job failed at the image pull on every push
      # to dev without running a single test. With no KAFKA_* variables the official
      # image starts a single-node KRaft broker advertising localhost:9092, which is
      # exactly what the runner needs; setting any of them switches it to a mode
      # that requires the whole configuration, so none are set.
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for the broker
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/9092) 2>/dev/null; then
              echo "broker up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::warning::broker did not come up; kafka-marked tests will skip"

      - name: Run the JVM-dependent tests
        env:
          LLM_PROVIDER: none
          TMS_API_KEY: ci-test-key
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPARK_LOCAL_IP: "127.0.0.1"
          # local[2] rather than local[*]: a runner has two cores and letting
          # Spark claim more produces scheduling noise, not speed.
          SPARK_DRIVER_MEMORY: 2g
        run: pytest -m "spark" -q
